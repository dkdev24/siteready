name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # ubuntu-latest is best-effort only — windows-latest and macos-latest are
    # the required MVP platforms (Windows/npx-resolution and macOS/Homebrew
    # layout bugs are what this matrix exists to catch).
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the example fixture's Astro dependency requires
          # Node >=22.12.0 (this floated in on a caret-range bump — verify-loop
          # failed identically on all three OSes on Node 20, confirming this
          # wasn't a platform-specific issue).
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax check (lint)
        run: npm run lint

      - name: Scan smoke test (both scanners, stable target)
        run: node src/cli.js https://example.com --scanners is-agentic,afdocs --sampling none --out ./out/ci-smoke

      - name: Full loop smoke test (asserts the fixer improves the score)
        run: node scripts/verify-loop.js
